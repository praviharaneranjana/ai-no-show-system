name: Build desktop installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

defaults:
  run:
    working-directory: frontend

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # No Apple Developer certificate is configured for this project, so
      # skip electron-builder's automatic signing-identity discovery on
      # macOS. The resulting .dmg is unsigned: end users will see a
      # Gatekeeper warning on first launch (right-click > Open to bypass).
      - name: Build macOS installer
        if: matrix.os == 'macos-latest'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run dist:mac

      - name: Build Windows installer
        if: matrix.os == 'windows-latest'
        run: npm run dist:win

      - uses: actions/upload-artifact@v4
        with:
          name: shai-desktop-${{ matrix.os }}
          path: |
            frontend/dist-electron/*.dmg
            frontend/dist-electron/*.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            frontend/dist-electron/*.dmg
            frontend/dist-electron/*.exe
