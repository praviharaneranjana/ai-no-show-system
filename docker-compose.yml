# One-command local stack:  docker compose up --build
# Frontend http://localhost:3000   API docs http://localhost:8000/docs
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: noshow
      POSTGRES_PASSWORD: noshow
      POSTGRES_DB: noshow_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noshow -d noshow_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://noshow:noshow@db:5432/noshow_db
      API_KEY: ${API_KEY:-dev-api-key-change-me}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  frontend:
    build: ./frontend
    environment:
      BACKEND_API_URL: http://backend:8000
      BACKEND_API_KEY: ${API_KEY:-dev-api-key-change-me}
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  pgdata:
